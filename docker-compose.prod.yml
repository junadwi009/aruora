# Production stack: built static web (nginx) reverse-proxying /api → gunicorn.
# Only the web port is published; api + db stay on the internal network.
#
#   cp .env.example .env   # set LLM_MODE/keys/etc, change DB creds for prod
#   docker compose -f docker-compose.prod.yml up -d --build
#   open http://<host>:${WEB_PORT:-80}
#
# Before exposing publicly, see the "Production deploy" section of README.md
# (TLS termination + a passcode/auth gate are NOT included here).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ielts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ielts}
      POSTGRES_DB: ${POSTGRES_DB:-ielts}
    volumes:
      - ielts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ielts}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ielts}:${POSTGRES_PASSWORD:-ielts}@db:5432/${POSTGRES_DB:-ielts}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE: ""
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ielts_pgdata:
