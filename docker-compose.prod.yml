# Production-like UAT: terminate HTTPS at a trusted edge before publishing.
# Copy ops/uat.env.example to .env and supply real, private values.
# This file deliberately cannot boot as an insecure HTTP-only deployment.
x-runtime-env: &runtime-env
  APP_ENV: production
  SESSION_SECRET: ${SESSION_SECRET:?Set a strong random SESSION_SECRET}
  COOKIE_SECURE: "1"
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:?Set the public UAT hostname}
  APP_BASE_URL: ${APP_BASE_URL:?Set the HTTPS UAT origin}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-ielts}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ielts}}
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGIN: ""
  EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-1}
  FAIL_CLOSED_ON_MAIL: ${FAIL_CLOSED_ON_MAIL:-1}

x-worker: &worker
  build: ./api
  env_file: .env
  environment: *runtime-env
  volumes:
    - ./fixtures:/fixtures:ro
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ielts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ielts}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:-}
    volumes:
      - ielts_pgdata:/var/lib/postgresql
      - ./ops/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The temporary initialization server is socket-only. Wait for the final
      # TCP server so a half-finished initialization cannot admit migrations.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-ielts} -d ${POSTGRES_DB:-ielts}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ielts_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Exactly one migration process. Workers cannot race startup schema changes.
  migrate:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-ielts}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ielts}}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *worker
    environment:
      <<: *runtime-env
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}
      TRUSTED_PROXY_PROTO: ${TRUSTED_PROXY_PROTO:-0}
    # Development Dockerfile still supports its migration convenience command;
    # production overrides it because the dedicated migrate service owns DDL.
    command: ["gunicorn", "-b", "0.0.0.0:5050", "--timeout", "120", "--workers", "2", "wsgi:app"]
    volumes:
      - ./fixtures:/fixtures:ro
      - ielts_audio:/app/data/audio_tmp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5050/api/health/ready', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker-llm:
    <<: *worker
    command: >
      celery -A app.jobs.celery_app:celery worker -Q llm_generate,llm_score
      --concurrency=2 --prefetch-multiplier=1 --time-limit=300
      --soft-time-limit=240 --max-tasks-per-child=50 --loglevel=info

  # Renamed from worker-infra: ASR cannot consume delivery-recovery slots.
  worker-asr:
    <<: *worker
    volumes:
      - ./fixtures:/fixtures:ro
      - ielts_audio:/app/data/audio_tmp
    command: >
      celery -A app.jobs.celery_app:celery worker -Q asr
      --concurrency=1 --prefetch-multiplier=1 --time-limit=240
      --soft-time-limit=180 --max-tasks-per-child=8 --loglevel=info

  worker-maintenance:
    <<: *worker
    command: >
      celery -A app.jobs.celery_app:celery worker -Q maintenance
      --concurrency=1 --prefetch-multiplier=1 --time-limit=120 --loglevel=info

  # Mail queue remains reserved; current account mail still uses synchronous
  # SMTP. Do not advertise async mail delivery merely because a queue exists.
  worker-beat:
    <<: *worker
    command: ["celery", "-A", "app.jobs.celery_app:celery", "beat", "--loglevel=info"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE: ""
    # Bind locally by default. A TLS edge proxies to this private HTTP port.
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ielts_pgdata:
  ielts_redisdata:
  ielts_audio:
