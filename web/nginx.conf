server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WS09-01: do not advertise the server version.
    server_tokens off;

    # gzip text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Security headers (WS09-05) — defence-in-depth for the served SPA ────────
    # CSP (WS09-06) allows Google Sign-In (script/frame/connect to
    # accounts.google.com) and inline styles/data-URI images the app uses;
    # tighten further if you drop GSI. Validate against a CSP violation report
    # feed in staging before changing this policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; frame-src https://accounts.google.com; connect-src 'self' https://accounts.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # WS09-05: microphone is self-only (speaking practice records locally);
    # everything else the app does not need is denied.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), interest-cohort=()" always;
    # WS09-01: STAGED HSTS — browsers ignore this over plain HTTP, so it is
    # safe to ship now; it starts protecting as soon as TLS is terminated.
    # Confirm every required subdomain is HTTPS, then raise to
    # "max-age=31536000; includeSubDomains". Do NOT add `preload`.
    add_header Strict-Transport-Security "max-age=300" always;

    # API → Flask/gunicorn. Long timeout for live LLM scoring / ASR. As heavy
    # work moves to queued jobs (WS07), shorten these rather than holding
    # HTTP workers for minutes.
    # Use the Docker embedded DNS (127.0.0.11) + a variable upstream so nginx
    # starts even if `api` isn't resolvable yet (resolved per-request, not at boot).
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream api;
        proxy_pass http://$api_upstream:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 25m;   # speech audio uploads
        # WS09-05: authenticated responses must not be cached anywhere.
        add_header Cache-Control "no-store" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── WS09-01: HTTP → HTTPS redirect (enable when TLS termination is added) ──────
# Terminate TLS in front of this server (or add a 443 server block with
# certificates), then replace the `listen 80` server above with:
#
# server {
#     listen 80;
#     server_name aruora.example;          # your TRUSTED_HOSTS entry
#     return 301 https://$host$request_uri;
# }
#
# Publish ONLY this edge port; api/db/redis/workers stay on the internal
# network (docker-compose.prod.yml already does this).
