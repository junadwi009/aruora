server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API → Flask/gunicorn. Long timeout for live LLM scoring (Sonnet) / ASR.
    # Use the Docker embedded DNS (127.0.0.11) + a variable upstream so nginx
    # starts even if `api` isn't resolvable yet (resolved per-request, not at boot).
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream api;
        proxy_pass http://$api_upstream:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        client_max_body_size 25m;   # speech audio uploads
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
