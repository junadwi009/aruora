server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Security headers (defence-in-depth for the served SPA) ──────────────────
    # CSP allows Google Sign-In (script/frame/connect to accounts.google.com) and
    # inline styles/data-URI images the app uses; tighten further if you drop GSI.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; frame-src https://accounts.google.com; connect-src 'self' https://accounts.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Enable once TLS is terminated in front of nginx:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API → Flask/gunicorn. Long timeout for live LLM scoring (Sonnet) / ASR.
    # Use the Docker embedded DNS (127.0.0.11) + a variable upstream so nginx
    # starts even if `api` isn't resolvable yet (resolved per-request, not at boot).
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream api;
        proxy_pass http://$api_upstream:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        client_max_body_size 25m;   # speech audio uploads
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
