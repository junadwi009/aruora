# CI-only overlay. It never publishes a public staging endpoint.
services:
  migrate:
    image: aruora-api:${ARUORA_IMAGE_TAG:?Set the tested source revision}
  api:
    image: aruora-api:${ARUORA_IMAGE_TAG:?Set the tested source revision}
  worker-llm:
    image: aruora-api:${ARUORA_IMAGE_TAG:?Set the tested source revision}
  worker-asr:
    image: aruora-api:${ARUORA_IMAGE_TAG:?Set the tested source revision}
  worker-maintenance:
    image: aruora-api:${ARUORA_IMAGE_TAG:?Set the tested source revision}
  worker-beat:
    image: aruora-api:${ARUORA_IMAGE_TAG:?Set the tested source revision}
  web:
    image: aruora-web:${ARUORA_IMAGE_TAG:?Set the tested source revision}
  ci-tls:
    image: aruora-web:${ARUORA_IMAGE_TAG:?Set the tested source revision}
    ports: ['127.0.0.1:8443:443']
    volumes:
      - ./ops/ci/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.ci/tls:/etc/nginx/ci-tls:ro
    depends_on:
      web:
        condition: service_started
