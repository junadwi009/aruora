# WS11-05: automated dependency updates. Vulnerability/drive-by PRs are
# triaged per 11 §Task WS11-05 — severity/impact triage, no blind majors.
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
