name: Security

# Security scanners fail the workflow on findings or scanner failures.
# No continue-on-error / shell success masking is permitted on audit steps.
on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  python-deps:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit API requirements
        working-directory: api
        run: pip-audit -r requirements.txt --strict

  node-deps:
    name: Node dependency audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Audit (high+ fails)
        working-directory: web
        run: npm audit --audit-level=high
