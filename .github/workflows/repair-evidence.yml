name: Repair evidence
on:
  push:
    branches: ['fix/uat-login-runtime-20261005']
    paths: ['.github/workflows/repair-evidence.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Resolve candidate (no forced upgrades, no audit suppressions)
        working-directory: web
        run: |
          mkdir -p ../evidence
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));p.devDependencies.vitest="4.1.11";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          rm package-lock.json
          npm install --ignore-scripts
          cp package.json package-lock.json ../evidence/
      - name: Verify candidate frontend
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          npm audit --audit-level=moderate --json > ../evidence/npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-evidence
          path: evidence/
          retention-days: 3
