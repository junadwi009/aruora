name: Repair evidence
on:
  push:
    branches: ['fix/uat-login-runtime-20261005']
    paths: ['.github/workflows/repair-evidence.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare offline regression dependencies
        run: |
          mkdir -p evidence/wheels
          pip download -d evidence/wheels flask==3.1.3 flask-cors==6.0.5 redis==8.1.0 celery==5.6.3 fakeredis==2.37.1 alembic==1.14.0
      - name: Resolve candidate using npm 11
        working-directory: web
        run: |
          npm install --global npm@11
          npm --version
          npm view vitest@4.1.11 peerDependencies engines --json
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));p.devDependencies.vitest="4.1.11";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          rm package-lock.json
          npm install --ignore-scripts
          cp package.json package-lock.json ../evidence/
      - name: Verify candidate frontend
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          npm audit --audit-level=moderate --json > ../evidence/npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-evidence
          path: evidence/
          retention-days: 3
