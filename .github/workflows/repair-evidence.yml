name: Repair evidence
on:
  pull_request:
    paths:
      - '.github/workflows/repair-evidence.yml'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Snapshot tracked source for reproducible investigation
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git archive --format=tar HEAD | gzip > evidence/source.tar.gz
      - name: Resolve a candidate lockfile without forced upgrades
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact vitest@4.1.11
          npm audit fix --package-lock-only --ignore-scripts
          cp package.json package-lock.json ../evidence/
      - name: Verify the candidate frontend
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
          npm audit --audit-level=moderate --json > ../evidence/npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-evidence
          path: evidence/
          retention-days: 3
