name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies and frozen metric data
        run: |
          pip install -r api/requirements.txt
          python api/app/services/metric_resources.py --prepare
      - name: Download spaCy model (essay metrics)
        run: python -m spacy download en_core_web_sm
      - name: Run tests
        working-directory: api
        run: python -m pytest -q

  migrations:
    name: DB migrations (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aruora_ci
          POSTGRES_PASSWORD: aruora_ci
          POSTGRES_DB: aruora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aruora_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://aruora_ci:aruora_ci@localhost:5432/aruora_ci
      TEST_MIGRATIONS_PG_URL: postgresql+psycopg://aruora_ci:aruora_ci@localhost:5432/aruora_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies and frozen metric data
        run: |
          pip install -r api/requirements.txt
          python api/app/services/metric_resources.py --prepare
      - name: Upgrade empty database to head
        working-directory: api
        run: alembic upgrade head
      - name: ORM metadata matches migrated schema (no divergence)
        working-directory: api
        run: alembic check
      - name: Upgrade from prior revision succeeds (chained)
        working-directory: api
        run: |
          alembic downgrade -1
          alembic upgrade head
      - name: Migration test suite (SQLite chain + PostgreSQL variants)
        working-directory: api
        run: python -m pytest tests/test_migrations.py -q

  web:
    name: Web (tsc + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Type-check
        working-directory: web
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Secret scan (no API key in bundle)
        run: bash tests/secret_scan.sh
      - name: Brand check (ARUORA naming, no legacy name)
        working-directory: web
        run: |
          grep -q "ARUORA" dist/assets/*.js
          if grep -Rq "IELTS Coach" dist/; then echo "legacy product name found in bundle" && exit 1; fi
