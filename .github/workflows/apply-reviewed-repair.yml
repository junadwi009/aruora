name: Apply reviewed repair
on:
  push:
    branches: ['fix/uat-login-runtime-20261005']
    paths: ['.repair/**', '.github/workflows/apply-reviewed-repair.yml']
permissions:
  contents: write
  actions: read
jobs:
  apply:
    if: github.repository == 'junadwi009/aruora' && github.ref == 'refs/heads/fix/uat-login-runtime-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download the previously tested lockfile
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37278450637
          name: repair-evidence
          path: ${{ runner.temp }}/reviewed-lock
      - name: Verify and apply reviewed application files (no workflow writes)
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          LOCK_DIR: ${{ runner.temp }}/reviewed-lock
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, os, pathlib, shutil, subprocess, tempfile
          branch = 'fix/uat-login-runtime-20261005'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD']
          remote = git('ls-remote', 'origin', 'refs/heads/' + branch).split()[0]
          assert remote == os.environ['EXPECTED_HEAD'], 'Concurrent branch change; refusing to overwrite'
          allowed = set('''
          .github/workflows/jobs-integration.yml
          api/app/__init__.py
          api/app/data/models.py
          api/app/data/repositories.py
          api/app/jobs/celery_app.py
          api/app/jobs/delivery.py
          api/app/jobs/handlers.py
          api/app/jobs/service.py
          api/app/ratelimit.py
          api/app/routes/_evaluation.py
          api/app/routes/jobs.py
          api/app/routes/speaking.py
          api/app/routes/writing.py
          api/app/services/evaluation.py
          api/app/services/guarded_gateway.py
          api/migrations/versions/b26c20261005_job_dispatch.py
          api/tests/test_jobs_broker_canary.py
          api/tests/test_reliable_evaluation.py
          api/tests/test_uat_runtime_regressions.py
          api/tests/test_ws27_task_pool.py
          docker-compose.prod.yml
          docs/UAT_REPAIR_RUNTIME.md
          ops/uat.env.example
          web/e2e/uat-regressions.spec.ts
          web/package.json
          web/src/components/menu/AppShell.tsx
          web/src/experience/learning/LearningWorkspace.tsx
          web/src/experience/learning/ResponseScreen.tsx
          web/src/experience/learning/api.ts
          web/src/experience/learning/scoring.test.ts
          web/src/experience/learning/scoring.ts
          '''.split())
          parts = sorted(pathlib.Path('.repair').glob('*.txt'))
          assert [p.name for p in parts] == [f'{i:02d}.txt' for i in range(10)]
          packed = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '9e8383cefd01ccac6e23ce8c9f81bdcec5df57826af6b3b98ec44c087fd8997f'
          patch = lzma.decompress(packed)
          assert len(patch) == 108512
          paths = set()
          for line in patch.decode().splitlines():
              if line.startswith('diff --git '):
                  a, b = line.split()[2:]
                  assert a.startswith('a/') and b == 'b/' + a[2:]
                  paths.add(a[2:])
          assert paths == allowed, 'Unexpected patch paths'
          excluded = '.github/workflows/jobs-integration.yml'
          with tempfile.NamedTemporaryFile(suffix='.patch') as f:
              f.write(patch); f.flush()
              subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '--exclude=' + excluded, f.name], check=True)
              subprocess.run(['git', 'apply', '--unidiff-zero', '--exclude=' + excluded, f.name], check=True)
          allowed.remove(excluded)
          lock = pathlib.Path(os.environ['LOCK_DIR']) / 'package-lock.json'
          assert hashlib.sha256(lock.read_bytes()).hexdigest() == '7115428eb19bea3d2d39f41265269eb7cf53ec5be1ea2cee8fd9fa1fdd99cd09'
          shutil.copyfile(lock, 'web/package-lock.json')
          allowed.add('web/package-lock.json')
          shutil.rmtree('.repair')
          subprocess.run(['git', 'add', '--all', '--', *sorted(allowed), '.repair'], check=True)
          changed = set(git('diff', '--cached', '--name-only').splitlines())
          assert changed == allowed | {f'.repair/{i:02d}.txt' for i in range(10)}
          assert not any(p.startswith('.github/') for p in changed)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: durable scoring jobs, recovery, production bootstrap and audited web dependencies'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          print('Repair commit:', git('rev-parse', 'HEAD'))
          PY
