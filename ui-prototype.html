<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IELTS Coach — UI/UX + Motion Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --color-primary-50:#EEF2FF; --color-primary-100:#E0E7FF;
  --color-primary-600:#4F46E5; --color-primary-700:#4338CA; --color-primary-800:#3730A3;
  --color-accent-500:#14B8A6; --color-accent-600:#0D9488;
  --color-success:#16A34A; --color-warning:#D97706; --color-danger:#DC2626; --color-info:#2563EB;
  --color-bg:#FAF8F3; --color-surface:#FFFDFA; --color-surface-2:#F3F0E9;
  --color-border:#E8E2D6; --color-text:#17140F; --color-text-2:#45403A; --color-muted:#6B6456;
  --color-cefr-a:#64748B; --color-cefr-b1:#0EA5E9; --color-cefr-b2:#14B8A6; --color-cefr-c1:#6366F1; --color-cefr-c2:#8B5CF6;
  --font-ui:"Inter",system-ui,sans-serif; --font-display:"Lexend","Inter",system-ui,sans-serif; --font-reading:"Lexend","Inter",system-ui,sans-serif;
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:22px;
  --shadow-e1:0 1px 2px rgba(15,23,42,.06);
  --shadow-e2:0 6px 20px -6px rgba(30,41,59,.18),0 2px 6px -2px rgba(30,41,59,.10);
  --shadow-e3:0 18px 48px -12px rgba(49,46,129,.28),0 6px 16px -8px rgba(30,41,59,.16);
  --ease:cubic-bezier(.2,0,.2,1); --dur-fast:120ms; --dur-base:180ms; --dur-slow:280ms;
}
.dark{
  --color-bg:#14110C; --color-surface:#1C1813; --color-surface-2:#27221A;
  --color-border:#3A332A; --color-text:#F4F0E8; --color-text-2:#CFC7B8; --color-muted:#A69C8A;
  --color-primary-50:#20203a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"kern" 1,"liga" 1;transition:background var(--dur-slow) var(--ease),color var(--dur-slow) var(--ease)}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty;margin:0}
button{font-family:inherit}
.tabular{font-variant-numeric:tabular-nums}
.display{font-family:var(--font-display)}
.muted{color:var(--color-muted)}

#stage{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;display:none}
.screen.active{display:block}
.journey-bg{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 50% -10%,color-mix(in srgb,var(--color-primary-50) 70%,transparent),transparent)}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeSlideIn var(--dur-slow) var(--ease) both}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:none;border-radius:var(--radius-md);font-weight:600;font-size:14px;min-height:44px;padding:0 18px;background:var(--color-primary-600);color:#fff;box-shadow:var(--shadow-e1);transition:transform var(--dur-fast) var(--ease),box-shadow var(--dur-base) var(--ease),background var(--dur-base) var(--ease),filter var(--dur-base) var(--ease)}
.btn:hover{filter:brightness(1.05);box-shadow:var(--shadow-e2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.lg{min-height:50px;padding:0 24px;font-size:15px}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.btn.secondary{background:var(--color-surface);color:var(--color-text);border:1px solid var(--color-border);box-shadow:none}
.btn.secondary:hover{background:var(--color-surface-2);filter:none}
.btn.ghost{background:transparent;color:var(--color-muted);box-shadow:none;font-weight:500}
.btn.ghost:hover{color:var(--color-text);transform:none;box-shadow:none}
.linkbtn{background:none;border:none;color:var(--color-muted);cursor:pointer;font-size:14px;min-height:44px;padding:0 8px;text-underline-offset:2px}
.linkbtn:hover{color:var(--color-text);text-decoration:underline}
.linkbtn.xs{font-size:12px}

.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-e1);padding:20px}
.card.interactive{cursor:pointer;transition:transform var(--dur-base) var(--ease),box-shadow var(--dur-base) var(--ease),border-color var(--dur-base) var(--ease)}
.card.interactive:hover{transform:translateY(-2px);box-shadow:var(--shadow-e2);border-color:color-mix(in srgb,var(--color-primary-600) 40%,var(--color-border))}

.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;background:color-mix(in srgb,var(--band,#64748B) 15%,transparent);color:var(--band,#64748B)}
.chip[data-band="A1A2"]{--band:var(--color-cefr-a)}
.chip[data-band="B1"]{--band:var(--color-cefr-b1)}
.chip[data-band="B2"]{--band:var(--color-cefr-b2)}
.chip[data-band="C1"]{--band:var(--color-cefr-c1)}
.chip[data-band="C2"]{--band:var(--color-cefr-c2)}
.badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:700;background:var(--color-surface-2);color:var(--color-muted)}
.badge.success{background:color-mix(in srgb,var(--color-success) 15%,transparent);color:var(--color-success)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--color-muted)}
.brandmark{display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);background:var(--color-text);color:var(--color-surface)}

.field{display:flex;flex-direction:column;gap:6px}
.flabel{font-size:12px;font-weight:500;color:var(--color-muted)}
.input,.select,textarea.ta{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text);font-family:inherit;font-size:14px;transition:border-color var(--dur-base) var(--ease),box-shadow var(--dur-base) var(--ease)}
.input:focus,.select:focus,textarea.ta:focus{outline:none;border-color:var(--color-primary-600);box-shadow:0 0 0 3px color-mix(in srgb,var(--color-primary-600) 18%,transparent)}
textarea.ta{resize:vertical;line-height:1.55}

.radiocard{display:flex;align-items:flex-start;gap:12px;padding:16px;border:1px solid var(--color-border);border-radius:var(--radius-lg);background:var(--color-surface);cursor:pointer;transition:border-color var(--dur-base) var(--ease),background var(--dur-base) var(--ease),box-shadow var(--dur-base) var(--ease)}
.radiocard:hover{border-color:color-mix(in srgb,var(--color-primary-600) 35%,var(--color-border))}
.radiocard[aria-checked="true"]{border-color:var(--color-primary-600);background:color-mix(in srgb,var(--color-primary-600) 6%,var(--color-surface));box-shadow:0 0 0 1px var(--color-primary-600) inset}
.radiocard .dot{width:20px;height:20px;border-radius:999px;border:2px solid var(--color-border);flex:0 0 auto;margin-top:1px;transition:border-color var(--dur-base) var(--ease)}
.radiocard[aria-checked="true"] .dot{border-color:var(--color-primary-600);background:radial-gradient(circle at 50% 50%,var(--color-primary-600) 0 5px,transparent 6px)}
.iconbox{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius-md);flex:0 0 auto;background:color-mix(in srgb,var(--color-primary-600) 12%,transparent);color:var(--color-primary-600)}

.pbar{height:6px;border-radius:999px;background:var(--color-surface-2);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--color-primary-600);border-radius:999px;transition:width var(--dur-slow) var(--ease)}
.stepind{display:flex;align-items:center;gap:8px}
.stepind .s{display:flex;align-items:center;gap:8px;color:var(--color-muted);font-size:12px;font-weight:600}
.stepind .n{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--color-surface-2);color:var(--color-muted);transition:background var(--dur-base),color var(--dur-base)}
.stepind .s.done .n,.stepind .s.cur .n{background:var(--color-primary-600);color:#fff}
.stepind .s.cur{color:var(--color-text)}
.stepind .bar{flex:1;height:2px;background:var(--color-border);min-width:14px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:var(--color-surface-2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:999px;background:var(--color-primary-600);cursor:pointer;box-shadow:var(--shadow-e1);border:3px solid var(--color-surface);transition:transform var(--dur-fast)}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.12)}

#s-app{display:none}
#s-app.active{display:flex}
.shell{display:flex;height:100%;width:100%;background:var(--color-bg)}
.sidebar{display:flex;flex-direction:column;width:256px;flex:0 0 256px;background:var(--color-surface);border-right:1px solid var(--color-border);padding:16px 0;box-shadow:var(--shadow-e1)}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 16px;margin-bottom:26px}
.sb-brand .brandmark{width:36px;height:36px}
.sb-brand span{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.navlist{list-style:none;margin:0;padding:0 8px;display:flex;flex-direction:column;gap:2px;flex:1}
.navitem{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-md);font-size:14px;font-weight:500;color:var(--color-text-2);background:none;border:none;cursor:pointer;min-height:44px;text-align:left;transition:background var(--dur-base) var(--ease),color var(--dur-base) var(--ease)}
.navitem:hover{background:var(--color-surface-2);color:var(--color-text)}
.navitem.active{font-weight:600;color:var(--color-text);background:color-mix(in srgb,var(--color-primary-600) 8%,transparent)}
.navitem .lbar{position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);height:20px;width:4px;border-radius:999px;background:var(--color-primary-600);transition:transform var(--dur-base) var(--ease)}
.navitem.active .lbar{transform:translateY(-50%) scaleY(1)}
.navitem .lbl{flex:1}
.sb-foot{padding:8px 8px 0;margin-top:auto;border-top:1px solid var(--color-border)}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.view{flex:1;overflow-y:auto;display:none}
.view.active{display:block}
.vhead{position:sticky;top:0;z-index:5;background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.vhead h1{font-family:var(--font-display);font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px}
.vbody{padding:24px;max-width:820px}
.vbody.wide{max-width:none}

.tf{display:flex;flex-direction:column;min-height:100%}
.tf header{position:sticky;top:0;z-index:5;background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:12px 16px 0;box-shadow:var(--shadow-e1);display:flex;flex-direction:column;gap:8px}
.tf .row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.tf .sec{font-size:16px;font-weight:600}
.tf .of{font-size:14px;font-weight:500;color:var(--color-muted)}
.tf .timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding:5px 12px;border-radius:999px;background:var(--color-surface-2);display:inline-flex;gap:6px;align-items:center}
.tf .hbar{height:4px;margin:0 -16px;background:var(--color-surface-2)}
.tf .hbar>i{display:block;height:100%;background:var(--color-primary-600);transition:width var(--dur-slow) var(--ease)}
.tf main{flex:1;padding:24px 16px}
.tf footer{position:sticky;bottom:0;background:var(--color-surface);border-top:1px solid var(--color-border);padding:12px 16px;display:flex;justify-content:flex-end;box-shadow:0 -2px 8px -4px rgba(15,23,42,.08)}

.numtabs{display:flex;gap:8px;margin-bottom:20px}
.numtab{width:44px;height:44px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;transition:all var(--dur-base)}
.numtab.on{border-color:var(--color-primary-600);box-shadow:0 0 0 2px color-mix(in srgb,var(--color-primary-600) 30%,transparent)}
.numtab.off{color:var(--color-muted);background:var(--color-surface-2)}
.qcard{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-e1);padding:18px;margin-bottom:14px}
.qcard .q{font-size:15px;margin-bottom:10px}
.opt{width:100%;text-align:left;padding:12px 14px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);margin-top:8px;cursor:pointer;font-size:14px;transition:all var(--dur-base)}
.opt:hover{border-color:var(--color-primary-600);background:color-mix(in srgb,var(--color-primary-600) 5%,var(--color-surface))}
.opt.sel{border-color:var(--color-primary-600);background:color-mix(in srgb,var(--color-primary-600) 8%,var(--color-surface));font-weight:600}

.acc{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);box-shadow:var(--shadow-e1);margin-bottom:14px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px;background:none;border:none;cursor:pointer;font-size:16px;font-weight:700;color:var(--color-text);text-align:left}
.acc .chev{transition:transform var(--dur-base) var(--ease);color:var(--color-muted)}
.acc.open .chev{transform:rotate(180deg)}
.acc .panel{max-height:0;overflow:hidden;transition:max-height var(--dur-slow) var(--ease)}
.acc.open .panel{max-height:400px}
.acc .panel .inner{padding:0 20px 20px;color:var(--color-text-2);font-size:14px;line-height:1.6}

#protobar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--color-text) 92%,transparent);color:var(--color-surface);border-radius:999px;padding:6px 8px;box-shadow:var(--shadow-e3);backdrop-filter:blur(6px);font-size:13px}
#protobar button{background:transparent;border:none;color:inherit;cursor:pointer;border-radius:999px;padding:8px;display:flex;align-items:center;justify-content:center;transition:background var(--dur-fast);font-size:16px;line-height:1}
#protobar button:hover{background:rgba(255,255,255,.16)}
#pblabel{min-width:190px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
#pblabel small{opacity:.6;font-weight:500}
.pbdivider{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 2px}
#jumpwrap{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;background:rgba(10,8,4,.5);padding:24px}
#jumpwrap.open{display:flex}
#jumpcard{background:var(--color-surface);color:var(--color-text);border-radius:var(--radius-xl);box-shadow:var(--shadow-e3);padding:22px;max-width:640px;width:100%;max-height:80vh;overflow:auto}
#jumpcard h3{font-family:var(--font-display);font-size:18px;margin-bottom:14px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.jitem{text-align:left;padding:10px 12px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);cursor:pointer;font-size:13px;transition:all var(--dur-base)}
.jitem:hover{border-color:var(--color-primary-600);background:var(--color-surface-2)}
.jitem b{display:block;font-size:11px;color:var(--color-muted);font-weight:600;margin-bottom:2px}
.jgroup{grid-column:1/-1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-muted);font-weight:700;margin:10px 0 2px}

svg{display:block}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:720px){.sidebar{display:none}.vbody{padding:16px}#pblabel{min-width:120px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="protobar">
  <button id="pbPrev" title="Previous (left arrow)">&lsaquo;</button>
  <span id="pblabel"></span>
  <button id="pbNext" title="Next (right arrow)">&rsaquo;</button>
  <span class="pbdivider"></span>
  <button id="pbJump" title="Jump to screen">&#9638;</button>
  <button id="pbTheme" title="Toggle light / dark">&#9790;</button>
</div>
<div id="jumpwrap"><div id="jumpcard"><h3>Jump to any screen</h3><div class="jgrid" id="jgrid"></div></div></div>

<script>
const I = {
  book:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
  home:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>',
  head:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M18 14h3v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2z"/><path d="M3 14a9 9 0 0 1 18 0"/></svg>',
  mic:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10a7 7 0 0 1-14 0M12 19v3"/></svg>',
  pen:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  vol:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>',
  layers:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 12 10 5 10-5M2 17l10 5 10-5"/></svg>',
  clip:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><path d="m9 14 2 2 4-4"/></svg>',

  else setHTML(body,`<div style="display:flex;flex-direction:column;gap:16px"><h2 class="display" style="font-size:18px;font-weight:600">What band are you aiming for?</h2><div class="field"><div style="display:flex;justify-content:space-between"><span class="flabel">Target band</span><span class="tabular" style="font-weight:700;color:var(--color-primary-600)" id="obTv">${obTarget.toFixed(1)}</span></div><input type="range" min="4" max="9" step="0.5" value="${obTarget}" oninput="obTarget=+this.value;document.getElementById('obTv').textContent=obTarget.toFixed(1)"></div></div>`);

}

/* 08-11 Placement */
const pl=scr('s-placement');
function readingBody(){return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start">
  <div class="card" style="font-family:var(--font-reading);line-height:1.7;font-size:15px">
    <p style="margin-bottom:14px">Rewilding is an approach to conservation that goes beyond simply protecting what remains of natural habitats. It aims to restore ecosystems to a more self-sustaining state, often by reintroducing large predators or herbivores.</p>
    <p style="margin-bottom:14px">The most famous rewilding experiment is the reintroduction of grey wolves to Yellowstone National Park in 1995. Before the reintroduction, elk populations had grown unchecked and grazed riverbanks heavily, preventing tree regeneration.</p>
    <p>In Europe, organisations such as Rewilding Europe are working to restore large tracts of rural land abandoned after the decline of traditional farming.</p></div>
  <div>${['Rewilding aims to manage every detail of natural habitats to protect biodiversity.','Grey wolves were reintroduced to Yellowstone National Park in 1995.','The elk in Yellowstone increased in number after wolves were reintroduced.'].map((q,i)=>`<div class="qcard"><div class="q">${i+1}. ${q}</div>${['True','False','Not Given'].map(o=>`<button class="opt${i===1&&o==='True'?' sel':''}">${o}</button>`).join('')}</div>`).join('')}<button class="btn secondary" style="margin-top:4px">Submit</button></div></div>`;}
const plSections=[
 {name:'Listening',step:1,body:()=>`<div class="numtabs">${[1,2,3,4].map((n,i)=>`<div class="numtab ${i===0?'on':'off'}">${n}</div>`).join('')}</div>
   <div class="card" style="margin-bottom:14px;display:flex"><button class="btn secondary">${I.play} Play</button></div>
   ${['What material is the funerary stele made from?','What did the Egyptians call the soul that required food after death?','How many canopic jars were typically used in a single burial?'].map((q,i)=>`<div class="qcard"><div class="q">${i+1}. ${q}</div><input class="input" placeholder="Type your answer..."></div>`).join('')}`},
 {name:'Reading',step:2,body:()=>readingBody()},
 {name:'Writing',step:3,body:()=>`<div style="max-width:640px;display:flex;flex-direction:column;gap:20px">
   <div class="card" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">Task 2</span><span class="badge">0 / 250 words</span></div>
   <p style="font-size:14px;line-height:1.6">Some people believe technology has made our lives simpler. Others argue it has made life more complicated. Discuss both views and give your opinion.</p></div>
   <div class="field"><span class="flabel">Your response</span><textarea class="ta" rows="10" placeholder="Write your response here..."></textarea></div></div>`},
 {name:'Speaking',step:4,body:()=>`<div style="max-width:640px;display:flex;flex-direction:column;gap:20px">
   <div class="card"><p style="font-size:14px;font-weight:600;margin-bottom:4px">Part 2 &middot; Cue card</p><p style="font-size:14px;line-height:1.6">Describe a place you have visited that made a strong impression on you. Say where it is, when you went, what you did, and why it impressed you.</p></div>
   <div class="card" style="background:var(--color-surface-2);display:flex;align-items:center;gap:16px"><button class="btn secondary">${I.mic} Record answer</button><span class="muted" style="font-size:14px">Record your answer; the transcript appears below and stays editable.</span></div>
   <div class="field"><span class="flabel">Transcript</span><textarea class="ta" rows="6" placeholder="Your transcript will appear here..."></textarea></div></div>`},
];
function renderPlacement(idx){const s=plSections[idx];
  setHTML(pl,`<div class="tf"><header><div class="row"><div style="display:flex;align-items:center;gap:12px"><span class="sec">${s.name}</span><span class="of tabular">${s.step} of 4</span></div><span class="timer">${I.clock} <span id="plTimer">10:00</span></span></div><div class="hbar"><i style="width:${s.step/4*100}%"></i></div></header><main class="anim">${s.body()}</main><footer><button class="btn lg" onclick="${idx<3?`go(${8+idx})`:'go(11)'}">${idx<3?'Next':'Submit'}</button></footer></div>`);
  startTimer();}
let timerH=null;
function startTimer(){clearInterval(timerH);let t=600;const n=document.getElementById('plTimer');timerH=setInterval(()=>{t--;if(t<0||!document.body.contains(n)){clearInterval(timerH);return;}n.textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;},1000);}

const gen=scr('s-generating');
function renderGenerating(){const steps=['Building your Reading set...','Preparing Listening clips...','Drafting Speaking prompts...','Assembling Writing tasks...'];
  setHTML(gen,`<div class="journey-bg"><div class="anim" style="width:100%;max-width:448px;display:flex;flex-direction:column;gap:24px">
    <div style="text-align:center;display:flex;flex-direction:column;gap:8px"><h1 class="display" style="font-size:24px;font-weight:800">Building your plan...</h1><p class="muted" style="font-size:14px">Usually a few seconds. Hang tight!</p></div>
    <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px">${steps.map((s,i)=>`<li class="genrow" data-i="${i}" style="display:flex;align-items:center;gap:12px;border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:12px 16px;background:var(--color-surface);box-shadow:var(--shadow-e1);opacity:.3;transition:opacity var(--dur-slow),box-shadow var(--dur-slow),border-color var(--dur-slow)"><span class="gdot" style="width:20px;height:20px;border-radius:999px;flex:0 0 auto;background:var(--color-border)"></span><span style="font-size:14px;font-weight:500">${s}</span></li>`).join('')}</ul>
    <div><div style="font-size:13px" class="muted">Generating practice content</div><div class="pbar" style="margin-top:6px"><i id="genBar" style="width:0%"></i></div></div></div></div>`);}
let genH=null;
function animateGenerating(){renderGenerating();clearInterval(genH);let p=0;const rows=[].slice.call(gen.querySelectorAll('.genrow')),bar=gen.querySelector('#genBar');
  genH=setInterval(()=>{p+=4;if(p>100){clearInterval(genH);return;}bar.style.width=p+'%';const cur=Math.min(3,Math.floor(p/25));
    rows.forEach((r,i)=>{r.style.opacity=i<cur?.6:i===cur?1:.3;r.style.borderColor=i===cur?'var(--color-primary-600)':'var(--color-border)';const d=r.querySelector('.gdot');
      if(i<cur){d.style.background='color-mix(in srgb,var(--color-success) 15%,transparent)';setHTML(d,I.check);}
      else if(i===cur){d.style.background='color-mix(in srgb,var(--color-primary-600) 20%,transparent)';d.style.border='2px solid var(--color-primary-600)';}});},90);}

/* 13 Results */
function radar(){const c=150,vals=[2.8/9,2.8/9,5/9,0],ang=[-90,0,90,180];
  const pts=vals.map((v,i)=>{const a=ang[i]*Math.PI/180,r=v*110;return [c+Math.cos(a)*r,c+Math.sin(a)*r];});
  const rings=[1,.75,.5,.25].map(f=>{const p=ang.map(d=>{const a=d*Math.PI/180,r=f*110;return `${c+Math.cos(a)*r},${c+Math.sin(a)*r}`;}).join(' ');return `<polygon points="${p}" fill="none" stroke="var(--color-border)" stroke-width="1"/>`;}).join('');
  return `<svg viewBox="0 0 300 300" width="100%" height="280">${rings}<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="color-mix(in srgb,var(--color-primary-600) 25%,transparent)" stroke="var(--color-primary-600)" stroke-width="2"/><text x="150" y="24" text-anchor="middle" fill="var(--color-muted)" font-size="14">Listening</text><text x="286" y="154" text-anchor="end" fill="var(--color-muted)" font-size="14">Reading</text><text x="150" y="292" text-anchor="middle" fill="var(--color-muted)" font-size="14">Writing</text><text x="14" y="154" fill="var(--color-muted)" font-size="14">Speaking</text></svg>`;}
setHTML(scr('s-results'),`<div style="min-height:100%;overflow-y:auto"><div class="anim" style="max-width:672px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:24px">
  <div style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><h1 class="display tabular" style="font-size:38px;font-weight:800">Overall Band 3.5</h1>${chip('A1A2')}</div><p class="muted" style="font-size:14px">Your Writing is your strongest skill — let us build from here.</p></div>
